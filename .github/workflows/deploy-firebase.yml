name: Deploy to Firebase
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: |
          npm ci --no-audit --no-fund
          npm --prefix functions ci --no-audit --no-fund

      - name: Run test suites
        run: |
          node tests/firebase-portal.mjs
          node tests/portal.mjs

      - name: Build Firebase frontend and functions
        run: npm run build:firebase

      - name: Write functions runtime environment
        env:
          ADMIN_MOBILE: ${{ secrets.ADMIN_MOBILE }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          WA_BRIDGE_URL: ${{ secrets.WA_BRIDGE_URL }}
          WA_BRIDGE_TOKEN: ${{ secrets.WA_BRIDGE_TOKEN }}
          WA_GROUP_ID: ${{ secrets.WA_GROUP_ID }}
        run: |
          if [ -z "$ADMIN_MOBILE" ]; then
            echo "ADMIN_MOBILE secret is required in GitHub repository secrets."
            exit 1
          fi
          {
            echo "ADMIN_MOBILE=$ADMIN_MOBILE"
            [ -n "$ADMIN_EMAIL" ] && echo "ADMIN_EMAIL=$ADMIN_EMAIL"
            [ -n "$WA_BRIDGE_URL" ] && echo "WA_BRIDGE_URL=$WA_BRIDGE_URL"
            [ -n "$WA_BRIDGE_TOKEN" ] && echo "WA_BRIDGE_TOKEN=$WA_BRIDGE_TOKEN"
            [ -n "$WA_GROUP_ID" ] && echo "WA_GROUP_ID=$WA_GROUP_ID"
          } > functions/.env

      - name: Authenticate to Google Cloud / Firebase
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DAILYREPORT_9265A }}

      - name: Deploy to Firebase
        run: npx --yes firebase-tools deploy --project dailyreport-9265a --non-interactive --force
